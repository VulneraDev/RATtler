name: macOS community preview

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        include:
          - runner: macos-15
            artifact: apple-silicon
          - runner: macos-15-intel
            artifact: intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - run: MACOSX_DEPLOYMENT_TARGET=13.0 python -m pip install . pyinstaller==6.22.3
      - run: MACOSX_DEPLOYMENT_TARGET=13.0 python -m pip install --no-binary=yara-python yara-python==4.5.4
      - run: ./app/macos/build.sh --portable --archive
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: RATtler-macOS-${{ matrix.artifact }}
          path: |
            build/macos/*.zip
            build/macos/*.sha256
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: RATtler-macOS-*
          path: artifacts
          merge-multiple: true
      - name: Publish preview release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" artifacts/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "RATtler $GITHUB_REF_NAME Community Preview" \
            --prerelease \
            --notes "Download one ZIP: Apple-Silicon for M-series Macs, or Intel for Intel Macs. Open the ZIP, drag RATtler.app into Applications, and launch it there. If macOS blocks the first launch, use System Settings > Privacy & Security > Open Anyway. RATtler 0.14 adds ReplayForge safe detection replay and Chainlight time-ordered evidence chains. Positive and negative metadata-only fixtures run through the production correlation logic with expected rule IDs, chain counts, and performance budgets. The native Detection Lab, CLI, and CI use the same contracts. ATT&CK mappings are coverage context, not verdicts. Native enforcement still requires Apple's restricted Endpoint Security entitlement."
