name: macOS community preview

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        include:
          - runner: macos-15
            artifact: apple-silicon
          - runner: macos-15-intel
            artifact: intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install . pyinstaller
      - run: ./app/macos/build.sh --portable --archive
      - uses: actions/upload-artifact@v4
        with:
          name: RATtler-macOS-${{ matrix.artifact }}
          path: |
            build/macos/*.zip
            build/macos/*.sha256
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: RATtler-macOS-*
          path: artifacts
          merge-multiple: true
      - name: Publish preview release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" artifacts/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "RATtler $GITHUB_REF_NAME Community Preview" \
            --prerelease \
            --notes "Download one ZIP: Apple-Silicon for M-series Macs, or Intel for Intel Macs. Open the ZIP, drag RATtler.app into Applications, and launch it there. If macOS blocks the first launch, use System Settings > Privacy & Security > Open Anyway. Recovery Vault is an explicit opt-in that keeps quota-limited, versioned document and photo copies locally, freezes after ransomware evidence, and recovers into a new Desktop folder without overwriting originals. The native write-authorization guard now compiles in shadow and acknowledged enforcement modes, but activation remains dependent on Apple's restricted Endpoint Security entitlement and signed system-extension packaging."
