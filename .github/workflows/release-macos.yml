name: macOS community preview

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        include:
          - runner: macos-15
            artifact: apple-silicon
          - runner: macos-15-intel
            artifact: intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install . pyinstaller
      - run: ./app/macos/build.sh --portable --archive
      - uses: actions/upload-artifact@v4
        with:
          name: RATtler-macOS-${{ matrix.artifact }}
          path: |
            build/macos/*.zip
            build/macos/*.sha256
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: RATtler-macOS-*
          path: artifacts
          merge-multiple: true
      - name: Publish preview release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" artifacts/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "RATtler $GITHUB_REF_NAME Community Preview" \
            --prerelease \
            --notes "Download one ZIP: Apple-Silicon for M-series Macs, or Intel for Intel Macs. Open the ZIP, drag RATtler.app into Applications, and launch it there. If macOS blocks the first launch, use System Settings > Privacy & Security > Open Anyway. RATtler now records path plus CDHash, signature type, and Team ID for risky loaded code; explicitly flags App Translocation; and reports a changed CDHash or signer at the same loaded path. Notarization remains a distribution-trust signal, not a runtime-behavior verdict. Recovery Vault remains opt-in, local, quota-limited, and non-overwriting. Native enforcement still requires Apple's restricted Endpoint Security entitlement."
