name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e .
      - if: runner.os != 'Windows'
        run: python -m unittest discover -s tests -v
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $lines = @(& python -m unittest discover -s tests -v 2>&1)
          $code = $LASTEXITCODE
          $lines | ForEach-Object { Write-Output $_ }
          if ($code -ne 0) {
            $text = ($lines -join "`n")
            $marker = $text.IndexOf('======================================================================')
            $detail = if ($marker -ge 0) { $text.Substring($marker) } else { (($lines | Select-Object -Last 40) -join "`n") }
            $escaped = $detail.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Windows unit-test failure::$escaped"
            exit $code
          }
      - if: runner.os == 'macOS'
        run: make -C native/macos
      - if: runner.os == 'macOS' && matrix.python-version == '3.13'
        run: ./app/macos/build.sh
