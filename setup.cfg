[metadata]
name = rattler-antirat
version = 0.19.0
description = An open-source behavioral anti-RAT endpoint monitor
long_description = file: README.md
long_description_content_type = text/markdown
license = MIT
license_files =
    LICENSE
    THIRD_PARTY_NOTICES.md
    licenses/*
author = RATtler contributors
classifiers =
    Development Status :: 3 - Alpha
    Environment :: Console
    License :: OSI Approved :: MIT License
    Programming Language :: Python :: 3
    Topic :: Security

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.9, !=3.9.0, !=3.9.1
install_requires =
    cryptography==48.0.1; platform_system == "Darwin" and platform_machine == "x86_64"
    cryptography==50.0.1; platform_system != "Darwin" or platform_machine != "x86_64"

[options.packages.find]
where = src

[options.entry_points]
console_scripts =
    rattler = rattler.cli:main

[options.extras_require]
yara =
    yara-python==4.5.4
