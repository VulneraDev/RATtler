[metadata]
name = rattler-antirat
version = 0.2.0
description = An open-source behavioral anti-RAT endpoint monitor
long_description = file: README.md
long_description_content_type = text/markdown
license = MIT
license_files = LICENSE
author = RATtler contributors
classifiers =
    Development Status :: 3 - Alpha
    Environment :: Console
    License :: OSI Approved :: MIT License
    Programming Language :: Python :: 3
    Topic :: Security

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.9

[options.packages.find]
where = src

[options.entry_points]
console_scripts =
    rattler = rattler.cli:main
